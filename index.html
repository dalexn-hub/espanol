<title>Español</title>
<style>
:root {
  --bg: #F4EFE6; --card: #FFFDF9; --ink: #1E1A16; --muted: #7A7066; --line: #E6DED2;
  --accent: #C4452C; --accent-ink: #FFF4E6; --soft: #EDE5D8;
  --ok: #1F7A4A; --ok-bg: #DDF1E4; --bad: #B3321F; --bad-bg: #F8DED8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16130F; --card: #221E19; --ink: #F3ECE2; --muted: #A2978A; --line: #352F28;
    --accent: #E0613F; --accent-ink: #1B0F0A; --soft: #2E2822;
    --ok: #5BC48A; --ok-bg: #173325; --bad: #F07B63; --bad-bg: #3A1D17;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
  font: 17px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
button { font: inherit; color: inherit; border: 0; cursor: pointer; touch-action: manipulation; }
.hidden { display: none !important; }

#app { position: fixed; top: 0; left: 0; right: 0; height: 100%; display: flex; flex-direction: column;
  padding: calc(env(safe-area-inset-top) + 6px) 14px calc(env(safe-area-inset-bottom) + 10px); }
#app.kb { padding-bottom: 8px; }

/* верхняя строка */
.top { display: flex; align-items: center; gap: 10px; min-height: 40px; color: var(--muted); font-size: 15px; }
.top .grow { flex: 1; }
.top b { color: var(--ink); font-weight: 600; }
.iconbtn { width: 40px; height: 40px; border-radius: 12px; background: transparent; font-size: 21px; color: var(--muted); }
.bar { height: 5px; border-radius: 3px; background: var(--soft); overflow: hidden; margin: 2px 0 10px; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }

/* карточка */
.card { flex: 1; min-height: 0; overflow-y: auto; background: var(--card); border: 1px solid var(--line);
  border-radius: 22px; padding: 16px 18px; display: flex; flex-direction: column; }
.card .inner { margin: auto 0; display: flex; flex-direction: column; gap: 12px; }
.tag { font-size: 13px; color: var(--muted); letter-spacing: .02em; }
.prompt { display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.prompt .text { font: 600 30px/1.2 ui-serif, "New York", Georgia, serif; overflow-wrap: anywhere; }
.prompt .text.ru { font: 600 25px/1.25 -apple-system, BlinkMacSystemFont, sans-serif; }
.say { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--soft); font-size: 18px; }
.say:active { transform: scale(.94); }

.choices { display: flex; flex-direction: column; gap: 8px; }
.choice { text-align: left; padding: 13px 16px; border-radius: 14px; background: var(--soft);
  border: 2px solid transparent; font-size: 17px; min-height: 52px; }
.choice:active { filter: brightness(.96); }
.choice.right { background: var(--ok-bg); border-color: var(--ok); }
.choice.wrong { background: var(--bad-bg); border-color: var(--bad); }
.choice:disabled { cursor: default; }

input#answer { width: 100%; font: 500 24px/1.2 ui-serif, "New York", Georgia, serif; text-align: center;
  padding: 13px 12px; border-radius: 14px; border: 2px solid var(--line); background: var(--bg); color: var(--ink);
  outline: none; -webkit-appearance: none; }
input#answer:focus { border-color: var(--accent); }

.feedback { display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
  font-weight: 700; font-size: 20px; }
.feedback.ok { color: var(--ok); }
.feedback.bad { color: var(--bad); }
.feedback .you { display: block; font-weight: 400; font-size: 16px; color: var(--muted); margin-top: 2px; }
.example { text-align: center; font: italic 19px/1.35 ui-serif, "New York", Georgia, serif; color: var(--muted); }


/* нижние кнопки */
.actions { display: flex; gap: 8px; margin-top: 8px; }
.btn { height: 56px; border-radius: 16px; font-size: 18px; font-weight: 600; padding: 0 14px; }
.btn.main { flex: 1.4; background: var(--accent); color: var(--accent-ink); }
.btn.main:disabled { opacity: .35; }
.btn.side { flex: 1; background: var(--soft); color: var(--ink); font-weight: 500; font-size: 16px; }
.btn:active:not(:disabled) { transform: scale(.98); }

/* экраны: между раундами, загрузка */
.screen { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 0 4px; }
.screen h2 { font: 600 26px/1.25 ui-serif, "New York", Georgia, serif; margin: 0 0 4px; text-align: center; }
.screen p { margin: 0 0 10px; text-align: center; color: var(--muted); }
.screen .btn { width: 100%; flex: none; }
.screen .btn.side { font-size: 17px; }

/* настройки */
#settings { position: fixed; inset: 0; background: var(--bg); z-index: 10; overflow-y: auto;
  padding: calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 24px); }
#settings h1 { font: 600 24px ui-serif, "New York", Georgia, serif; margin: 6px 0 14px; flex: 1; }
.sec { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; margin-bottom: 14px; }
.sec h3 { margin: 0 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.sec p { margin: 4px 0 12px; }
.sec .note { font-size: 14px; color: var(--muted); }
.sec .btn { width: 100%; height: 50px; margin-top: 8px; font-size: 17px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.switch { width: 52px; height: 32px; border-radius: 16px; background: var(--soft); position: relative; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: left .2s; }
.switch.on { background: var(--ok); }
.switch.on::after { left: 23px; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 90px); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 15px; z-index: 20;
  max-width: 90vw; text-align: center; }
</style>
</head>

</div>

function iso(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function today() { return iso(new Date()); }

// ================= Словарь =================
function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  text = text.replace(/^﻿/, "");
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += ch;
    } else if (ch === '"') q = true;
    else if (ch === ",") { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") {
      if (ch === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); rows.push(row); row = []; cell = "";
    } else cell += ch;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
function looksSpanish(s) { return /[a-záéíóúüñ¿¡]/i.test(s); }
function rowsFromCSV(text) {
  let raw = parseCSV(text).map(r => [0, 1, 2].map(i => (r[i] || "").trim())).filter(r => r[0] && r[1]);
  if (raw.length && !looksSpanish(raw[0][0])) raw = raw.slice(1);   // заголовок
  const seen = new Set(), out = [];
  for (const r of raw) { if (seen.has(r[0])) continue; seen.add(r[0]); out.push(r); }  // повторы — молча первая строка
  return out;
}
async function fetchWords() {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 10000);
  try {
    const res = await fetch(CSV_URL, { cache: "no-store", signal: ctrl.signal });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    const rows = rowsFromCSV(text);
    if (!rows.length) throw new Error("пустая таблица");
    store.set("words_csv", text);
    store.set("words_time", Date.now());
    return { rows, fresh: true };
  } finally { clearTimeout(t); }
}
async function loadWords() {
  try { return await fetchWords(); }
  catch (e) {
    const text = store.get("words_csv", null);
    if (text) return { rows: rowsFromCSV(text), fresh: false };
    throw e;
  }
}

  s = s.normalize("NFC").trim().toLowerCase();
  let a = 0, b = s.length;
  while (a < b && EDGE.includes(s[a])) a++;
  while (b > a && EDGE.includes(s[b - 1])) b--;
  return s.slice(a, b).replace(/\s+/g, " ").trim();
}

// ================= Планировщик (как build_session / apply_result) =================
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function newIntroducedToday() { const v = store.get("new_today", null); return v && v.d === today() ? v.n : 0; }
function countNewToday() { store.set("new_today", { d: today(), n: newIntroducedToday() + 1 }); }

function buildSession() {
  const t = today(), due = [], fresh = [];
  for (const r of rows) {
    const st = prog[r[0]];
    if (!st) fresh.push(r);
    else if ((st.next_due || t) <= t) due.push(r);
  }
  shuffle(due); shuffle(fresh);
  const quota = Math.max(0, NEW_PER_DAY - newIntroducedToday());
  return shuffle(due.concat(fresh.slice(0, quota))).slice(0, MAX_SESSION);
}
function applyResult(es, correct, allowPromote) {
  const st = prog[es] || { box: 1, correct: 0, wrong: 0 };
  if (correct) { st.correct += 1; if (allowPromote) st.box = Math.min(MAX_BOX, st.box + 1); }
  else { st.wrong += 1; st.box = 1; }
  st.last_seen = today();
  if (allowPromote || !correct) st.next_due = addDays(INTERVALS[st.box]);
  prog[es] = st;
}

// ================= Состояние =================
let rows = [], prog = {}, wordsFresh = false;
let queue = [], total = 0, done = 0, right = 0;
let answered = false, current = null, mode = "prod", lastCorrect = false, options = [];
let extraRound = false, mistakes = [], shown = new Set(), sessionDay = today();

const $ = id => document.getElementById(id);
const el = {
  app: $("app"), counter: $("counter"), score: $("score"), barWrap: $("barWrap"), bar: $("bar"),
  card: $("card"), tag: $("tag"), prompt: $("prompt"), sayPrompt: $("sayPrompt"), choices: $("choices"),
  answer: $("answer"), feedback: $("feedback"), example: $("example"),
  actions: $("actions"), btnIdk: $("btnIdk"), btnOk: $("btnOk"), btnMain: $("btnMain"), panel: $("panel"),
};

// ================= Карточка =================
function updateHeader() {
  el.counter.innerHTML = total ? `<b>${Math.min(done + 1, total)}</b> / ${total}` : "";
  const pct = done ? Math.round(right / done * 100) : 0;
  el.score.textContent = done ? `верно ${right}/${done} · ${pct}%` : "";
  el.bar.style.width = (total ? done / total * 100 : 0) + "%";
}
function showCardView(on) {
  for (const n of [el.card, el.actions, el.barWrap]) n.classList.toggle("hidden", !on);
  el.panel.classList.toggle("hidden", on);
}

function nextCard() {
  if (!queue.length) return roundOver(false);
  answered = false;
  current = queue.shift();
  const [es, ru] = current;
  const st = prog[es];
  const box = st ? st.box : 1;
  mode = box === 1 ? "recog" : "prod";

  el.feedback.innerHTML = ""; el.feedback.className = "feedback";
  el.example.textContent = "";
  el.btnOk.classList.add("hidden");
  el.btnIdk.classList.remove("hidden");
  el.btnMain.textContent = "Проверить";
  updateHeader();
  const extra = extraRound ? " · тренировка" : "";

  if (mode === "recog") {
    el.tag.textContent = (st ? "коробка 1" : "новое") + " · выберите перевод" + extra;
    el.prompt.textContent = es; el.prompt.className = "text";
    el.sayPrompt.classList.toggle("hidden", !ttsOn());
    const pool = shuffle([...new Set(rows.map(r => r[1]).filter(t => t !== ru))]);
    options = shuffle(pool.slice(0, 3).concat([ru]));
    el.choices.innerHTML = "";
    options.forEach((txt, i) => {
      const b = document.createElement("button");
      b.className = "choice"; b.textContent = txt;
      b.onclick = () => pick(i);
      el.choices.appendChild(b);
    });
    el.choices.classList.remove("hidden");
    el.answer.classList.add("hidden"); el.answer.blur();
    el.btnMain.disabled = true;
  } else {
    el.tag.textContent = `коробка ${box} · напишите по-испански` + extra;
    el.prompt.textContent = ru; el.prompt.className = "text ru";
    el.sayPrompt.classList.add("hidden");
    el.choices.classList.add("hidden"); el.choices.innerHTML = "";
    el.answer.value = "";
    el.answer.classList.remove("hidden");
    el.btnMain.disabled = false;
    el.answer.focus();
  }
  el.card.scrollTop = 0;
}

function pick(i) {
  if (answered) return;
  const btns = el.choices.children;
  if (options[i] !== current[1]) btns[i].classList.add("wrong");
  grade(options[i] === current[1], options[i], true);
}
function primary() {
  if (answered) return commit();
  if (mode !== "prod") return;
  const typed = el.answer.value;
  grade(normalize(typed) === normalize(current[0]), typed, true);
}
function dontKnow() { if (!answered) grade(false, "", false); }

function grade(correct, typed, allowOverride) {
  const [es, ru, ex] = current;
  answered = true; lastCorrect = correct;
  [...el.choices.children].forEach((b, i) => { b.disabled = true; if (options[i] === ru) b.classList.add("right"); });
  showFeedback(correct, typed);
  el.btnOk.classList.toggle("hidden", correct || !allowOverride);
  el.example.textContent = ex || "";
  el.btnIdk.classList.add("hidden");
  el.btnMain.textContent = "Дальше"; el.btnMain.disabled = false;
}
function showFeedback(correct, typed) {
  const [es, ru] = current;
  const answer = mode === "recog" ? ru : es;
  el.feedback.innerHTML = "";
  el.feedback.className = "feedback " + (correct ? "ok" : "bad");
  const box = document.createElement("div");
  box.textContent = (correct ? "✓  " : "✗  правильно: ") + answer;
  if (!correct && typed && typed.trim() && mode === "prod") {
    const y = document.createElement("span"); y.className = "you"; y.textContent = "вы: " + typed.trim(); box.appendChild(y);
  }
  el.feedback.appendChild(box);
  if (mode === "prod" && ttsOn()) {
    const s = document.createElement("button"); s.className = "say"; s.textContent = "🔊";
    s.onclick = () => speak(es); el.feedback.appendChild(s);
  }
}
function override() {
  lastCorrect = true;
  showFeedback(true, "");
  el.btnOk.classList.add("hidden");
}
function commit() {
  const es = current[0];
  if (!prog[es]) countNewToday();
  applyResult(es, lastCorrect, !extraRound);
  saveProgress();
  done += 1; shown.add(es);
  if (lastCorrect) { right += 1; mistakes = mistakes.filter(m => m[0] !== es); }
  else if (!mistakes.some(m => m[0] === es)) mistakes.push(current);
  if (sessionDay !== today()) return startDay();   // наступил новый день
  nextCard();
}

// ================= Пулы и экран между раундами =================
function poolNew() { return shuffle(rows.filter(r => !prog[r[0]] && !shown.has(r[0]))).slice(0, NEW_PER_DAY); }
function poolAhead() {
  return rows.filter(r => prog[r[0]] && !shown.has(r[0]))
    .sort((a, b) => (prog[a[0]].box || 1) - (prog[b[0]].box || 1)
      || String(prog[a[0]].next_due || "").localeCompare(String(prog[b[0]].next_due || "")))
    .slice(0, 20);
}
function panelButton(text, cls, fn) {
  const b = document.createElement("button"); b.className = "btn " + cls; b.textContent = text; b.onclick = fn;
  el.panel.appendChild(b);
}
function roundOver(firstEmpty) {
  showCardView(false); el.answer.blur();
  el.counter.innerHTML = ""; el.score.textContent = "";
  const pct = done ? Math.round(right / done * 100) : 0;
  const head = firstEmpty ? "На сегодня всё повторено" : `Раунд закончен: ${right} из ${done} верно (${pct}%)`;
  const mist = mistakes.slice(), nw = poolNew(), ahead = poolAhead();
  const any = mist.length || nw.length || ahead.length;
  el.panel.innerHTML = "";
  const h = document.createElement("h2"); h.textContent = head; el.panel.appendChild(h);
  const p = document.createElement("p");
  p.textContent = any ? "Чем продолжить?" : "Все слова из таблицы пройдены.";
  el.panel.appendChild(p);
  let first = true;
  const cls = () => { const c = first ? "main" : "side"; first = false; return c; };
  if (mist.length) panelButton(`Ошибки этой сессии (${mist.length})`, cls(), () => startRound(mist, true));
  if (nw.length) panelButton(`Новые слова (${nw.length})`, cls(), () => startRound(nw, false));
  if (ahead.length) panelButton(`Досрочный повтор (${ahead.length})`, cls(), () => startRound(ahead, true));
  panelButton("Закончить", "side", finish);
}
function finish() {
  el.panel.innerHTML = "";
  const h = document.createElement("h2"); h.textContent = "¡Hasta mañana!"; el.panel.appendChild(h);
  const p = document.createElement("p");
  p.textContent = done ? `Сегодня: ${right} из ${done} верно. Прогресс сохранён.` : "Прогресс сохранён.";
  el.panel.appendChild(p);
  panelButton("Ещё позаниматься", "side", () => roundOver(false));
}
function startRound(items, extra) {
  showCardView(true);
  extraRound = extra;
  queue = shuffle(items.slice());
  total = done + queue.length;
  nextCard();
}

// ================= Запуск дня =================
function showMessage(title, text, retry) {
  showCardView(false);
  el.panel.innerHTML = "";
  const h = document.createElement("h2"); h.textContent = title; el.panel.appendChild(h);
  if (text) { const p = document.createElement("p"); p.textContent = text; el.panel.appendChild(p); }
  if (retry) panelButton("Попробовать ещё раз", "main", retry);
}
async function startDay() {
  showMessage("Загружаю словарь…", "");
  try {
    const r = await loadWords();
    rows = r.rows; wordsFresh = r.fresh;
  } catch (e) {
    return showMessage("Нет словаря", "Не удалось скачать Google Таблицу, а сохранённой копии ещё нет. Проверьте интернет.", startDay);
  }
  prog = loadProgress();
  sessionDay = today();
  queue = buildSession(); total = queue.length; done = right = 0;
  extraRound = false; mistakes = []; shown = new Set();
  if (!wordsFresh) toast("Нет интернета — словарь из сохранённой копии");
  if (!queue.length) return roundOver(true);
  showCardView(true);
  nextCard();
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && sessionDay !== today() && !answered) startDay();
});

// ================= Озвучка =================
function ttsOn() { return "speechSynthesis" in window && store.get("tts", true); }
let esVoice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  esVoice = vs.find(v => v.lang === "es-ES" || v.lang === "es_ES") || vs.find(v => /^es/i.test(v.lang)) || null;
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
let lastUtter = null;   // держим ссылку: иначе iOS иногда обрывает озвучку
function speak(text) {
  if (!("speechSynthesis" in window)) return;
  const synth = speechSynthesis;
  if (!esVoice) pickVoice();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = esVoice ? esVoice.lang.replace("_", "-") : "es-ES";
  u.rate = 0.9;
  if (esVoice) u.voice = esVoice;
  lastUtter = u;
  // На iOS cancel() прямо перед speak() «съедает» фразу — отменяем, только если что-то звучит.
  if (synth.speaking || synth.pending) { synth.cancel(); setTimeout(() => synth.speak(u), 120); }
  else { synth.resume(); synth.speak(u); }
}

// ================= Настройки =================
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2800);
}
function fmtTime(ms) {
  if (!ms) return "—";
  const d = new Date(ms);
  return d.toLocaleDateString("ru-RU", { day: "numeric", month: "long" }) + ", " + d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
}
function plural(n, a, b, c) { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? b : c; }
function renderSettings() {
  $("dictInfo").textContent = `${rows.length} ${plural(rows.length, "слово", "слова", "слов")} · обновлён ${fmtTime(store.get("words_time", 0))}`;
  const n = Object.keys(prog).length;
  $("progInfo").textContent = `Изучается ${n} ${plural(n, "слово", "слова", "слов")}, сегодня отвечено ${done}.`;
  $("ttsSwitch").classList.toggle("on", store.get("tts", true));
}
$("gear").onclick = () => { renderSettings(); $("settings").classList.remove("hidden"); el.answer.blur(); };
$("closeSettings").onclick = () => { $("settings").classList.add("hidden"); if (!answered && mode === "prod" && !el.card.classList.contains("hidden")) el.answer.focus(); };
$("ttsSwitch").onclick = () => {
  store.set("tts", !store.get("tts", true)); renderSettings();
  if (current && !el.card.classList.contains("hidden")) {
    if (mode === "recog") el.sayPrompt.classList.toggle("hidden", !ttsOn());
    if (answered) showFeedback(lastCorrect, "");
  }
};
$("btnReload").onclick = async () => {
  try { const r = await fetchWords(); rows = r.rows; renderSettings(); toast(`Словарь обновлён: ${rows.length} слов. Новые слова — в следующем раунде.`); }
  catch (e) { toast("Не получилось: нет интернета?"); }
};
$("btnExport").onclick = async () => {
  const json = JSON.stringify(prog, null, 1);
  const name = `progress-${today()}.json`;
  const file = new File([json], name, { type: "application/json" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return; }
    catch (e) { if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
};
$("btnImport").onclick = () => $("importFile").click();
$("importFile").onchange = async (ev) => {
  const f = ev.target.files[0]; ev.target.value = "";
  if (!f) return;
  let data;
  try {
    data = JSON.parse(await f.text());
    const vals = Object.values(data);
    if (typeof data !== "object" || Array.isArray(data) || !vals.length || !vals.every(v => v && typeof v.box === "number"))
      throw new Error();
  } catch (_) { return toast("Это не файл прогресса"); }
  const n = Object.keys(data).length;
  if (!confirm(`Заменить текущий прогресс (${Object.keys(prog).length} слов) прогрессом из файла (${n} слов)?`)) return;
  prog = data; saveProgress();
  $("settings").classList.add("hidden");
  toast(`Импортировано: ${n} слов`);
  startDay();
};

// ================= Кнопки и клавиатура =================
// Кнопки не забирают фокус у поля ввода — клавиатура не прячется между карточками.
for (const b of [el.btnMain, el.btnIdk, el.btnOk]) b.addEventListener("pointerdown", e => { if (document.activeElement === el.answer) e.preventDefault(); });
el.btnMain.onclick = primary;
el.btnIdk.onclick = dontKnow;
el.btnOk.onclick = override;
el.sayPrompt.onclick = () => current && speak(current[0]);
el.answer.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); primary(); } });
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && answered && document.activeElement !== el.answer && $("settings").classList.contains("hidden")) { e.preventDefault(); commit(); }
});
// Подгоняем экран под видимую область, чтобы кнопки были прямо над клавиатурой.
function fitViewport() {
  const vv = window.visualViewport;
  if (!vv) return;
  el.app.style.height = vv.height + "px";
  el.app.style.transform = `translateY(${vv.offsetTop}px)`;
  el.app.classList.toggle("kb", vv.height < window.innerHeight - 80);
}
if (window.visualViewport) {
  visualViewport.addEventListener("resize", fitViewport);
  visualViewport.addEventListener("scroll", fitViewport);
  fitViewport();
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
startDay();
</script>
</body>
</html>
